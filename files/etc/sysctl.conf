# User defined entries should be added to this file not to /etc/sysctl.d/* as
# that directory is not backed-up by default and will not survive a reimage
net.ipv4.tcp_fastopen = 3

# 网络缓冲区优化（2.5GbE 双WAN）
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.netdev_max_backlog = 4000
# BBR 拥塞控制 + TCP 缓冲区（2026-05-07 双WAN满载优化：默认缓冲提升至4MB适配1200Mbps BDP）
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq_codel
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
# 低水位标记，避免TCP过量缓存未发送数据（2026-05-07 新增）
vm.swappiness=10
vm.vfs_cache_pressure=50
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.eth0.send_redirects=0
net.ipv4.conf.eth1.send_redirects=0
net.ipv4.conf.br-lan.send_redirects=0
net.ipv4.fib_multipath_hash_policy=1
net.ipv4.tcp_rmem = 4096 524288 33554432
net.ipv4.tcp_wmem = 4096 524288 33554432
net.ipv4.tcp_notsent_lowat = 262144

# 桥接流量跳过 netfilter（2026-05-25 恢复后补）
net.bridge.bridge-nf-call-iptables = 0
# NAPI 预算提高（2026-05-25 恢复后补）
net.core.dev_weight = 128
# 压缩 SACK 延迟降至 500μs（2026-05-25 恢复后补）
net.ipv4.tcp_comp_sack_delay_ns = 500000
net.ipv4.conf.docker0.send_redirects=0

# P2P 优化（2026-06-05 迅雷大量连接优化）
net.ipv4.tcp_max_syn_backlog = 4096
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.core.rps_sock_flow_entries = 16384

# conntrack TCP established 超时 7440s->3600s (2026-08-14)
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
